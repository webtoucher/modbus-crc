name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Pinned instead of ubuntu-latest: latest moved to 26.04, and the
    # actions/python-versions manifest has no CPython 3.9 builds for it.
    # 24.04 LTS covers every version from 3.9 to 3.15.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # "3.13t" is a free-threaded build (no GIL); the manifest has it for
        # linux-24.04, so the README claim is verified by a real run.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.13t", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata and contents
        run: |
          python -m pip install twine
          python -m twine check dist/*
          python -c "import zipfile, glob; print(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist())"
