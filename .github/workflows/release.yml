name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine
      - name: Run tests
        run: python -m pytest
      - name: Check that tag matches the package version
        run: |
          python - <<'PY'
          import os, pathlib, re
          text = pathlib.Path("modbus_crc/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "([^"]+)"', text).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if version != tag:
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          print("package version", version)
          PY
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/modbus-crc
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Makes re-runs of a failed release idempotent
          skip-existing: true

  github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "modbus-crc $GITHUB_REF_NAME" \
            --generate-notes
