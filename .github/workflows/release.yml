name: release

on:
  push:
    tags: ["v*"]
  # Allows re-publishing artifacts and the GitHub Release for an existing tag
  # without moving the tag itself.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v2.0"
        required: true

permissions:
  contents: read

env:
  TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install package and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine
      - name: Run tests
        run: python -m pytest
      - name: Check that tag matches the package version
        run: |
          python - <<'PY'
          import os, pathlib, re
          text = pathlib.Path("modbus_crc/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'__version__ = "([^"]+)"', text).group(1)
          tag = os.environ["TAG_NAME"].lstrip("v")
          if version != tag:
              raise SystemExit(f"tag {tag!r} does not match package version {version!r}")
          print("package version", version, "tag", os.environ["TAG_NAME"])
          PY
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/modbus-crc
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Makes re-runs of a failed release idempotent
          skip-existing: true

  github-release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # This job has no setup-python step, so it must not rely on a bare
      # `python`: Ubuntu images only guarantee `python3`.
      - name: Take release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import pathlib, re
          version = re.search(
              r'__version__ = "([^"]+)"',
              pathlib.Path("modbus_crc/__init__.py").read_text(encoding="utf-8"),
          ).group(1)
          notes = ""
          changelog = pathlib.Path("CHANGELOG.md")
          if changelog.exists():
              match = re.search(
                  r"^## \[%s\][^\n]*\n(.*?)(?=^## \[|\Z)" % re.escape(version),
                  changelog.read_text(encoding="utf-8"),
                  re.M | re.S,
              )
              if match:
                  notes = match.group(1).strip()
          if notes:
              pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
              print(f"release notes for {version}: {len(notes)} chars")
          else:
              print(f"no CHANGELOG section for {version}, GitHub will generate notes")
          PY
      # GH_REPO is explicit on purpose: the step must not depend on the git remote.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          if [ -s release-notes.md ]; then
            notes_args=(--notes-file release-notes.md)
          else
            notes_args=(--generate-notes)
          fi
          output=$(gh release create "$TAG_NAME" dist/* \
            --title "modbus-crc $TAG_NAME" "${notes_args[@]}" 2>&1)
          status=$?
          echo "$output"
          if [ $status -eq 0 ]; then
            exit 0
          fi
          if grep -qi "already exists" <<< "$output"; then
            echo "Release $TAG_NAME already exists, uploading artifacts instead"
            gh release upload "$TAG_NAME" dist/* --clobber
            exit $?
          fi
          echo "::error::gh release create failed: $(echo "$output" | tr '\n' ' ' | cut -c1-700)"
          exit 1
